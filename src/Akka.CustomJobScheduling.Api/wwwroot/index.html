<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Scheduler</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #262b36; --text: #e6e9ef;
    --dim: #8b93a4; --accent: #4f9cf9; --ok: #3fb950; --warn: #d29922;
    --bad: #f85149; --idle: #6e7681;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f7f9; --panel: #fff; --line: #e2e5ea; --text: #1c2029;
      --dim: #616b7c; --idle: #98a1b0;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .01em; }
  #conn { font-size: 12px; color: var(--dim); display: flex; align-items: center; gap: 6px; }
  #dot { width: 8px; height: 8px; border-radius: 50%; background: var(--idle); }
  #dot.live { background: var(--ok); }
  main { padding: 20px; display: grid; gap: 20px; max-width: 1100px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  section > h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim);
    margin: 0; padding: 12px 16px; border-bottom: 1px solid var(--line); font-weight: 600;
  }
  .pad { padding: 16px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 16px; }
  .stat .n { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat .l { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .05em; }
  .node { display: grid; gap: 6px; margin-bottom: 14px; }
  .node:last-child { margin-bottom: 0; }
  .node .row { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; }
  .node code { color: var(--dim); font-size: 12px; }
  .bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .05em;
    color: var(--dim); font-weight: 600; padding: 8px 16px; border-bottom: 1px solid var(--line);
  }
  td { padding: 8px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  .pill {
    display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px;
    font-weight: 600; border: 1px solid currentColor;
  }
  .Running { color: var(--accent); } .Waiting { color: var(--warn); }
  .Completed { color: var(--ok); } .Faulted { color: var(--bad); }
  .Cancelled { color: var(--idle); }
  .mini { width: 90px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .mini > i { display: block; height: 100%; background: currentColor; transition: width .3s; }
  .num { font-variant-numeric: tabular-nums; }
  form { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input, button {
    font: inherit; padding: 6px 10px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text);
  }
  input { width: 110px; }
  button { background: var(--accent); border-color: var(--accent); color: #fff; cursor: pointer; font-weight: 600; }
  button:hover { filter: brightness(1.1); }
  .empty { color: var(--dim); padding: 24px 16px; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>Job Scheduler</h1>
  <span id="conn"><span id="dot"></span><span id="connText">connecting…</span></span>
</header>

<main>
  <section>
    <h2>Cluster</h2>
    <div class="pad">
      <div class="stats" id="stats"></div>
    </div>
  </section>

  <section>
    <h2>Nodes</h2>
    <div class="pad" id="nodes"><div class="empty">no worker nodes</div></div>
  </section>

  <section>
    <h2>Submit</h2>
    <div class="pad">
      <form id="submit">
        <input id="size" type="number" min="1" max="100" value="20" title="work units">
        <input id="submitter" type="text" value="dashboard" title="submitter id">
        <button type="submit">Submit job</button>
        <span id="err" style="color:var(--bad);font-size:12px"></span>
      </form>
    </div>
  </section>

  <section>
    <h2>Jobs</h2>
    <div class="scroll">
      <table>
        <thead><tr>
          <th>Job</th><th>Submitter</th><th>Status</th><th>Progress</th><th>Node</th>
        </tr></thead>
        <tbody id="jobs"></tbody>
      </table>
    </div>
    <div class="empty" id="noJobs">no jobs yet</div>
  </section>
</main>

<script>
// Jobs are keyed by id and merged in place: the stream sends a full list on connect, then one
// frame per transition. Nothing here polls.
const jobs = new Map();
const el = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shortNode = a => a ? esc(String(a).split('@').pop()) : '<span style="color:var(--dim)">—</span>';

function renderQueue(q) {
  el('stats').innerHTML = [
    ['Running', q.running], ['Waiting', q.waiting],
    ['Queued work', q.queuedWork], ['Capacity free', `${q.availableCapacity}/${q.totalCapacity}`]
  ].map(([l, n]) => `<div class="stat"><div class="n">${esc(n)}</div><div class="l">${l}</div></div>`).join('');

  el('nodes').innerHTML = q.nodes.length ? q.nodes.map(n => {
    const pct = n.maxCapacity ? (n.inUse / n.maxCapacity) * 100 : 0;
    const state = n.reachable ? n.status : `${n.status} · unreachable`;
    return `<div class="node">
      <div class="row"><code>${shortNode(n.address)}</code>
        <span class="num">${n.inUse}/${n.maxCapacity} <span style="color:var(--dim)">${esc(state)}</span></span></div>
      <div class="bar"><i style="width:${pct}%"></i></div>
    </div>`;
  }).join('') : '<div class="empty">no worker nodes</div>';
}

function renderJobs() {
  const rows = [...jobs.values()].sort((a, b) => b.lastUpdatedAt.localeCompare(a.lastUpdatedAt));
  el('noJobs').style.display = rows.length ? 'none' : '';
  el('jobs').innerHTML = rows.map(j => `<tr>
    <td><code>${esc(j.id)}</code></td>
    <td style="color:var(--dim)">${esc(j.submitterId)}</td>
    <td><span class="pill ${esc(j.status)}">${esc(j.status)}</span></td>
    <td class="${esc(j.status)}">
      <div style="display:flex;align-items:center;gap:8px">
        <div class="mini"><i style="width:${(j.fraction * 100).toFixed(0)}%"></i></div>
        <span class="num" style="color:var(--text)">${(j.fraction * 100).toFixed(0)}%</span>
      </div>
    </td>
    <td>${shortNode(j.assignedNode)}</td>
  </tr>`).join('');
}

function connect() {
  const src = new EventSource('/cluster/events');

  src.addEventListener('open', () => {
    el('dot').classList.add('live');
    el('connText').textContent = 'live';
  });

  src.addEventListener('jobs', e => {
    jobs.clear();
    for (const j of JSON.parse(e.data).jobs) jobs.set(j.id, j);
    renderJobs();
  });

  src.addEventListener('queue', e => renderQueue(JSON.parse(e.data)));

  src.addEventListener('status', e => {
    const j = JSON.parse(e.data);
    jobs.set(j.id, j);
    renderJobs();
  });

  src.onerror = () => {
    el('dot').classList.remove('live');
    el('connText').textContent = 'reconnecting…';
    // EventSource reconnects on its own; nothing to do but reflect it in the UI.
  };
}

el('submit').addEventListener('submit', async e => {
  e.preventDefault();
  el('err').textContent = '';
  const res = await fetch('/jobs', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({
      size: Number(el('size').value),
      submitterId: el('submitter').value || 'dashboard'
    })
  });
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    el('err').textContent = `${res.status}: ${body.error ?? 'rejected'}`;
  }
});

connect();
</script>
</body>
</html>
